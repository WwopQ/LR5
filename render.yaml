databases:
  - name: rentcar-db
    databaseName: rentcar
    user: rentcar
    plan: free

services:
  - type: web
    name: rentcar-web
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn rentcar.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: rentcar-db
          property: connectionString
      - key: LOG_LEVEL
        value: "INFO"
