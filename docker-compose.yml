version: '3.9'

services:

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: rentcar_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-rentcar}
      POSTGRES_USER:     ${POSTGRES_USER:-rentcar_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rentcar_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rentcar_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Django приложение ─────────────────────────────────────────────────────
  web:
    build: .
    container_name: rentcar_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-rentcar_user}:${POSTGRES_PASSWORD:-rentcar_pass}@db:5432/${POSTGRES_DB:-rentcar}
      DEBUG: "False"
    volumes:
      - media_files:/app/media
      - static_files:/app/staticfiles
      - logs:/app/logs
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn rentcar.wsgi:application
               --bind 0.0.0.0:8000
               --workers 2
               --timeout 120"

volumes:
  postgres_data:
  media_files:
  static_files:
  logs:
