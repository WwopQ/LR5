{% extends "base.html" %}
{% block title %}Вход — RentCar{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-lg-4">
      <div class="text-center mb-4">
        <i class="fa-solid fa-car-side fa-3x" style="color:var(--rc-primary);"></i>
        <h2 class="fw-bold mt-2">Вход в аккаунт</h2>
        <p class="text-muted small">Войдите, чтобы арендовать автомобиль</p>
      </div>
      <div class="rc-form-card">
        <form method="post" action="">
          {% csrf_token %}
          {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
          <div class="mb-3">
            <label class="form-label"><i class="fa-solid fa-user me-1"></i>Логин</label>
            <input type="text" name="username" class="form-control" placeholder="Ваш логин" required autofocus>
          </div>
          <div class="mb-4">
            <label class="form-label"><i class="fa-solid fa-lock me-1"></i>Пароль</label>
            <input type="password" name="password" class="form-control" placeholder="Ваш пароль" required>
          </div>
          <button type="submit" class="btn btn-rc-primary w-100">
            <i class="fa-solid fa-right-to-bracket me-1"></i>Войти
          </button>
        </form>
        <hr class="my-3">
        <p class="text-center text-muted small mb-0">
          Нет аккаунта? <a href="{% url 'users:register' %}" class="fw-semibold">Зарегистрироваться</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
