{% extends "base.html" %}

{% block title %}Вход — RentCar{% endblock %}

{% block content %}
<h1>Вход</h1>

<form method="post" novalidate>
  {% csrf_token %}
  {% if next %}
    <input type="hidden" name="next" value="{{ next }}">
  {% endif %}

  <div class="form-group">
    <label for="id_username">Логин</label>
    <input
      type="text"
      id="id_username"
      name="username"
      required
      autofocus
      placeholder="Ваш логин"
    >
  </div>

  <div class="form-group">
    <label for="id_password">Пароль</label>
    <input
      type="password"
      id="id_password"
      name="password"
      required
      placeholder="Ваш пароль"
    >
  </div>

  <button type="submit">Войти</button>

  <p>Нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a></p>
</form>
{% endblock %}
